[package]
name = "cd-simulator"
version = "0.1.0"
description = "汽车风洞仿真：OpenFOAM 后端 + Tauri 前端"
edition = "2021"

[lib]
name = "cd_simulator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
