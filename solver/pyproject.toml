[project]
name = "windtunnel"
version = "0.1.0"
description = "cd_simulator 求解管线：汽车风洞 CFD 预处理/编排/后处理"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "trimesh>=4.0",
    "pymeshfix>=0.16",
    "meshio>=5.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
